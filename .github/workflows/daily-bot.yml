name: Bot Telegram Football

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-btts
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install requests

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python -u bot_btts.py

      - name: Sauvegarder le journal de calibration
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p data

          if [ ! -f data/predictions.csv ]; then
            echo "date,fixture_id,match,league,kickoff,market,player,probability,model_version,result" > data/predictions.csv
          fi

          git add data/predictions.csv

          if git diff --cached --quiet; then
            echo "Aucune mise à jour de calibration."
          else
            git commit -m "Mise à jour calibration"
            git pull --rebase
            git push
          fi
