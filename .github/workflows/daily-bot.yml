name: Bot pronostics

on:
  schedule:
    # 09:00 UTC = 10:00 à Paris en hiver (11:00 en été : mettre "0 8 * * *" fin mars)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-pronostics
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install requests

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python -u bot_btts.py

      - name: Sauvegarder le journal
        if: always()
        run: |
          if [ -f data/predictions.csv ]; then
            git config user.name "bot-pronostics"
            git config user.email "bot-pronostics@users.noreply.github.com"
            git add data/
            git diff --cached --quiet || (git commit -m "Journal des pronostics" && git pull --rebase && git push)
          fi
